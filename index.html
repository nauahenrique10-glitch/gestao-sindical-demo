<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão Sindical — Demo Completa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:#f6f5f8;color:#21182b;font-size:13px}
button,input,select{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:220px;background:#20172a;color:#d9d1df;padding:17px 13px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brandmark{width:35px;height:35px;background:#fff;color:#512866;border-radius:9px;display:grid;place-items:center;font-weight:900}
.brand small{display:block;color:#9e91a8;font-size:8px;letter-spacing:1.7px}.demo{border:1px solid #493854;background:#2a2034;padding:9px;border-radius:9px;font-size:9px;line-height:1.5}.demo b{color:#dcbbed}
.group{font-size:8px;letter-spacing:1.4px;color:#897b93;display:block;margin:16px 8px 5px}.nav{width:100%;border:0;background:transparent;color:#cfc6d7;text-align:left;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:10px}.nav:hover,.nav.active{background:#eee7f3;color:#442554;font-weight:800}
.main{margin-left:220px}.top{height:61px;background:#fff;border-bottom:1px solid #e8e3eb;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.top-right{display:flex;gap:10px;align-items:center}.top select{border:1px solid #ded6e4;border-radius:7px;padding:7px;background:#faf9fb;color:#49275c}.content{max-width:1200px;margin:auto;padding:30px}
.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.head h1{margin:2px 0 4px;font-size:27px}.head p{margin:0;color:#7c7083}.btn{border:0;background:#4d2a60;color:#fff;padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:700}.btn.secondary{background:#f0eaf3;color:#543064}.btn.danger{background:#8e3344}.btn.small{padding:6px 9px;font-size:9px}
.hero{background:#33243e;color:#fff;padding:25px;border-radius:13px;display:flex;justify-content:space-between;margin-bottom:14px}.hero h2{font-size:26px;margin:8px 0}.hero p{color:#d8cfe0}.hero strong{font-size:42px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.card,.panel{background:#fff;border:1px solid #e5dfe8;border-radius:10px}.card{padding:16px}.card span{font-size:9px;color:#827688}.card strong{display:block;font-size:22px;margin:7px 0}.card small{color:#9a909f}.panel{overflow:hidden;margin-top:12px}.panel-title{padding:15px 16px;font-weight:800;border-bottom:1px solid #eee9f0}.toolbar{display:flex;gap:8px;padding:12px;background:#fff;border:1px solid #e5dfe8;border-radius:10px;margin-bottom:12px}.toolbar input,.toolbar select,.modal input,.modal select{border:1px solid #ddd5e2;border-radius:7px;padding:8px;background:#fff}.toolbar input{flex:1}
table{width:100%;border-collapse:collapse}th{font-size:8px;letter-spacing:.7px;color:#76657f;background:#faf8fb;text-align:left;padding:10px}td{padding:12px 10px;border-top:1px solid #eee9f0;font-size:10px;color:#675b6d}td b{color:#33223d}.ok,.warn,.bad{padding:4px 7px;border-radius:7px;font-size:8px;font-weight:800}.ok{background:#e8f6ee;color:#347b56}.warn{background:#fff1da;color:#94661f}.bad{background:#fbe7ea;color:#9a3c4b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:15px}.day{min-height:75px;border:1px solid #ece6ef;border-radius:7px;padding:7px;background:#fff}.day b{font-size:10px}.day .event{margin-top:5px;background:#eee6f3;color:#5a356d;padding:4px;border-radius:5px;font-size:8px}
.modal-wrap{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:center;justify-content:center}.modal-wrap.show{display:flex}.modal{background:#fff;width:min(520px,92vw);border-radius:12px;padding:20px;box-shadow:0 20px 70px #0005}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:9px;color:#6e6275}.formgrid input,.formgrid select{width:100%;margin-top:4px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{display:none;position:fixed;right:22px;bottom:22px;background:#21182b;color:#fff;padding:11px 16px;border-radius:8px;z-index:20}
.totem{max-width:560px;margin:40px auto;text-align:center;background:#fff;border:1px solid #e5dfe8;border-radius:16px;padding:30px}.face{width:180px;height:180px;border:3px dashed #bca9c6;border-radius:50%;margin:20px auto;display:grid;place-items:center;font-size:50px;color:#765486}
.audit{font-size:9px;padding:8px 12px;border-bottom:1px solid #eee9f0}.muted{color:#93889a}.kicker{font-size:8px;letter-spacing:1.5px;color:#82539a;font-weight:900}
@media(max-width:900px){.side{width:175px}.main{margin-left:175px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 15px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><span class="brandmark">GS</span><div><b>Gestão Sindical</b><small>DEMO DE PORTFÓLIO</small></div></div>
<div class="demo">AMBIENTE DEMONSTRATIVO<br><b>Dados 100% fictícios · sem backend real</b></div>
<span class="group">OPERAÇÃO</span>
<button class="nav active" data-page="overview">Visão geral</button><button class="nav" data-page="operation">Operação do dia</button><button class="nav" data-page="history">Histórico operacional</button><button class="nav" data-page="employees">Funcionários</button><button class="nav" data-page="point">Controle de ponto</button><button class="nav" data-page="lists">Listas do dia</button><button class="nav" data-page="dailies">Diárias</button>
<span class="group">FINANCEIRO</span>
<button class="nav" data-page="closings">Fechamentos</button><button class="nav" data-page="payments">Pagamentos</button>
<span class="group">GESTÃO</span>
<button class="nav" data-page="documents">Documentos</button><button class="nav" data-page="epis">EPIs</button><button class="nav" data-page="reports">Relatórios</button><button class="nav" data-page="calendar">Calendário</button><button class="nav" data-page="users">Usuários e acessos</button><button class="nav" data-page="audit">Auditoria</button>
<span class="group">ACESSO</span><button class="nav" data-page="totem">Totem de ponto</button>
</aside>
<div class="main"><div class="top"><span>Meu espaço / <b id="crumb">Visão geral</b></span><div class="top-right"><select id="company"><option>Nexus Logística · Campinas</option><option>Atlas Distribuição · Mogi Mirim</option></select><select id="shift"><option>PM</option><option>AM</option></select><span>AD · <b>Administrador Demo</b></span></div></div><main class="content" id="content"></main></div>
</div>
<div class="modal-wrap" id="modal"><div class="modal" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const seed={
employees:[
{id:1,name:'Lucas Almeida',cpf:'***.482.***-10',role:'Auxiliar Logístico',status:'Ativo',facial:'Cadastrado',daily:100},
{id:2,name:'Mariana Costa',cpf:'***.731.***-42',role:'Auxiliar Logístico',status:'Ativo',facial:'Cadastrado',daily:100},
{id:3,name:'Rafael Martins',cpf:'***.206.***-55',role:'Conferente',status:'Ativo',facial:'Pendente',daily:120},
{id:4,name:'Beatriz Souza',cpf:'***.915.***-03',role:'Auxiliar Logístico',status:'Ativo',facial:'Cadastrado',daily:100},
{id:5,name:'Gabriel Rocha',cpf:'***.347.***-88',role:'Auxiliar Logístico',status:'Ativo',facial:'Pendente',daily:100},
{id:6,name:'Camila Ribeiro',cpf:'***.604.***-27',role:'Líder de Equipe',status:'Ativo',facial:'Cadastrado',daily:140}],
points:[{id:1,emp:1,date:'05/10/2026',time:'09:28',type:'Entrada',method:'Facial'},{id:2,emp:2,date:'05/10/2026',time:'09:31',type:'Entrada',method:'Facial'},{id:3,emp:3,date:'05/10/2026',time:'09:34',type:'Entrada',method:'Manual'}],
dailies:[{id:1,emp:1,date:'04/10/2026',base:100,vt:12,vr:32,status:'Aprovada'},{id:2,emp:2,date:'04/10/2026',base:100,vt:12,vr:32,status:'Em conferência'},{id:3,emp:3,date:'04/10/2026',base:120,vt:12,vr:32,status:'Aprovada'}],
payments:[{id:1,emp:1,value:432,status:'Pago'},{id:2,emp:2,value:288,status:'Aguardando'},{id:3,emp:3,value:576,status:'Pago'}],
docs:[{id:1,name:'Termo de ciência — ponto facial',type:'Termo',status:'Disponível'},{id:2,name:'Relatório operacional — Setembro',type:'Relatório',status:'Disponível'}],
epis:[{id:1,emp:1,item:'Colete refletivo',qty:1,date:'01/10/2026'},{id:2,emp:2,item:'Luva de proteção',qty:2,date:'02/10/2026'}],
users:[{id:1,name:'Administrador Demo',profile:'Administrador Geral',scope:'Todas as empresas',status:'Ativo'},{id:2,name:'Fernanda Lima',profile:'Financeiro',scope:'Nexus Logística',status:'Ativo'},{id:3,name:'Carlos Mendes',profile:'Supervisor',scope:'Nexus Logística',status:'Ativo'}],
audit:[{time:'05/10/2026 10:20',action:'Demo iniciada',module:'Sistema'},{time:'05/10/2026 10:12',action:'Pagamento confirmado',module:'Pagamentos'}]
};
let db=JSON.parse(localStorage.getItem('gs-demo-db')||'null')||structuredClone(seed);
const save=()=>localStorage.setItem('gs-demo-db',JSON.stringify(db));
const emp=id=>db.employees.find(e=>e.id==id)||{name:'—'};
const money=v=>'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2});
const status=s=>`<span class="${['Pago','Aprovada','Ativo','Cadastrado','Disponível'].includes(s)?'ok':s==='Pendente'||s==='Aguardando'||s==='Em conferência'?'warn':'bad'}">${s}</span>`;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1700)}
function audit(action,module){db.audit.unshift({time:new Date().toLocaleString('pt-BR'),action,module});save()}
function cards(a){return `<div class="cards">${a.map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function head(t,p,b=''){return `<div class="head"><div><h1>${t}</h1><p>${p}</p></div>${b}</div>`}
function table(headers,rows){return `<div class="panel"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function overview(){return `<span class="kicker">GESTÃO DE OPERAÇÕES</span>${head('Sua operação, sob controle.','Equipes, diárias e fechamentos em um só lugar.')}<div class="hero"><div><span class="kicker">PLANEJAR · CONFERIR · GERENCIAR</span><h2>Da escala ao pagamento.<br>Clareza em cada etapa.</h2><p>Demo navegável baseada no sistema de gestão operacional.</p></div><div><strong>${db.employees.length}</strong><br><small>diaristas cadastrados</small></div></div>${cards([['Diaristas ativos',db.employees.filter(x=>x.status==='Ativo').length,'Equipe cadastrada'],['Pontos hoje',db.points.filter(x=>x.date==='05/10/2026').length,'Registros'],['Diárias pendentes',db.dailies.filter(x=>x.status!=='Aprovada').length,'Conferência'],['Pagamentos pendentes',db.payments.filter(x=>x.status!=='Pago').length,'Financeiro']])}<div class="grid2"><div class="panel"><div class="panel-title">Fluxo operacional</div><div style="padding:18px">Equipe → Escala → Ponto → Diárias → Fechamento → Pagamentos</div></div><div class="panel"><div class="panel-title">Ambiente demonstrativo</div><div style="padding:18px">Todos os dados são fictícios. Alterações ficam somente neste navegador.</div></div></div>`}
function operation(){let rows=db.employees.slice(0,6).map((e,i)=>`<tr><td><b>${e.name}</b></td><td>${e.role}</td><td>${i<3?'Presente':'Aguardando'}</td><td>${i<3?status('Cadastrado'):status('Pendente')}</td></tr>`);return head('Operação do dia','Escala, presença e situação operacional.',`<button class="btn" onclick="createList()">Criar lista do dia</button>`)+cards([['Escalados',db.employees.length,'Equipe demo'],['Presentes',db.points.length,'Registros de entrada'],['Pendências',Math.max(db.employees.length-db.points.length,0),'Aguardando'],['Valor previsto',money(db.employees.reduce((a,e)=>a+e.daily,0)),'Diárias base']])+table(['FUNCIONÁRIO','FUNÇÃO','PRESENÇA','FACIAL'],rows)}
function history(){return head('Histórico operacional','Ações e eventos recentes da operação.')+table(['DATA/HORA','EVENTO','MÓDULO'],db.audit.slice(0,12).map(a=>`<tr><td>${a.time}</td><td><b>${a.action}</b></td><td>${a.module}</td></tr>`))}
function employees(){let rows=db.employees.map(e=>`<tr><td><b>${e.name}</b></td><td>${e.cpf}</td><td>${e.role}</td><td>${status(e.facial)}</td><td>${status(e.status)}</td><td><button class="btn small secondary" onclick="editEmployee(${e.id})">Editar</button> <button class="btn small danger" onclick="removeEmployee(${e.id})">Excluir</button></td></tr>`);return head('Funcionários','Cadastro e manutenção da equipe.',`<button class="btn" onclick="newEmployee()">+ Novo funcionário</button>`)+table(['NOME','CPF','FUNÇÃO','FACIAL','STATUS','AÇÕES'],rows)}
function point(){let rows=db.points.map(p=>`<tr><td><b>${emp(p.emp).name}</b></td><td>${p.date}</td><td>${p.time}</td><td>${p.type}</td><td>${p.method}</td></tr>`);return head('Controle de ponto','Registros de entrada e saída.',`<button class="btn" onclick="newPoint()">Registrar ponto</button>`)+table(['FUNCIONÁRIO','DATA','HORÁRIO','TIPO','MÉTODO'],rows)}
function lists(){return head('Listas do dia','Planejamento diário da equipe.',`<button class="btn" onclick="createList()">Gerar lista demonstrativa</button>`)+`<div class="panel"><div class="panel-title">Lista • 05/10/2026 • Turno PM</div><div style="padding:16px">${db.employees.map(e=>`<div style="padding:7px;border-bottom:1px solid #eee"><b>${e.name}</b> · ${e.role}</div>`).join('')}</div></div>`}
function dailies(){let rows=db.dailies.map(d=>`<tr><td><b>${emp(d.emp).name}</b></td><td>${d.date}</td><td>${money(d.base)}</td><td>${money(d.vt)}</td><td>${money(d.vr)}</td><td><b>${money(d.base+d.vt+d.vr)}</b></td><td>${status(d.status)}</td><td>${d.status!=='Aprovada'?`<button class="btn small" onclick="approveDaily(${d.id})">Aprovar</button>`:''}</td></tr>`);return head('Diárias','Conferência e aprovação dos dias trabalhados.',`<button class="btn" onclick="newDaily()">+ Nova diária</button>`)+table(['FUNCIONÁRIO','DATA','BASE','VT','VR','TOTAL','STATUS','AÇÃO'],rows)}
function closings(){let total=db.dailies.filter(d=>d.status==='Aprovada').reduce((a,d)=>a+d.base+d.vt+d.vr,0);return head('Fechamentos','Consolidação financeira por período.',`<button class="btn" onclick="closePeriod()">Fechar período</button>`)+cards([['Período','01–15 Out','Atual'],['Aprovadas',db.dailies.filter(d=>d.status==='Aprovada').length,'Diárias'],['Pendentes',db.dailies.filter(d=>d.status!=='Aprovada').length,'Revisão'],['Total aprovado',money(total),'Consolidado']])+`<div class="panel"><div class="panel-title">Fechamento demonstrativo</div><div style="padding:18px">Use “Fechar período” para simular a consolidação e gerar um evento de auditoria.</div></div>`}
function payments(){let rows=db.payments.map(p=>`<tr><td><b>${emp(p.emp).name}</b></td><td>1ª quinzena/out</td><td>${money(p.value)}</td><td>PIX</td><td>${status(p.status)}</td><td>${p.status!=='Pago'?`<button class="btn small" onclick="pay(${p.id})">Confirmar</button>`:''}</td></tr>`);return head('Pagamentos','Acompanhamento dos repasses.',`<button class="btn secondary" onclick="toast('QR PIX demonstrativo — sem transação real')">Simular PIX</button>`)+cards([['Aguardando',db.payments.filter(x=>x.status!=='Pago').length,'Pendentes'],['Pagos',db.payments.filter(x=>x.status==='Pago').length,'Confirmados'],['Total',money(db.payments.reduce((a,p)=>a+p.value,0)),'Período'],['Método','PIX','Demonstração']])+table(['BENEFICIÁRIO','REFERÊNCIA','VALOR','MÉTODO','STATUS','AÇÃO'],rows)}
function documents(){return head('Documentos','Arquivos e documentos operacionais.',`<button class="btn" onclick="addDocument()">+ Documento</button>`)+table(['DOCUMENTO','TIPO','STATUS','AÇÃO'],db.docs.map(d=>`<tr><td><b>${d.name}</b></td><td>${d.type}</td><td>${status(d.status)}</td><td><button class="btn small secondary" onclick="toast('Prévia demonstrativa')">Visualizar</button></td></tr>`))}
function epis(){return head('Gestão de EPIs','Entrega e controle de equipamentos.',`<button class="btn" onclick="addEpi()">Registrar entrega</button>`)+table(['FUNCIONÁRIO','EPI','QTD.','DATA'],db.epis.map(e=>`<tr><td><b>${emp(e.emp).name}</b></td><td>${e.item}</td><td>${e.qty}</td><td>${e.date}</td></tr>`))}
function reports(){return head('Relatórios','Indicadores consolidados da operação.',`<button class="btn secondary" onclick="exportDemo()">Exportar CSV</button>`)+cards([['Presença média','94%','Últimos 30 dias'],['Diárias',db.dailies.length,'Lançadas'],['Pagamentos',db.payments.length,'Registros'],['Equipe',db.employees.length,'Funcionários']])+`<div class="panel"><div class="panel-title">Indicadores</div><div style="padding:18px">O botão “Exportar CSV” gera um arquivo local com os funcionários fictícios da demonstração.</div></div>`}
function calendar(){let days=Array.from({length:31},(_,i)=>`<div class="day"><b>${i+1}</b>${[5,10,15,20].includes(i+1)?`<div class="event">${i+1===15?'Fechamento':'Operação PM'}</div>`:''}</div>`).join('');return head('Calendário','Agenda operacional e financeira.')+`<div class="panel"><div class="panel-title">Outubro de 2026</div><div class="calendar">${days}</div></div>`}
function users(){return head('Usuários e acessos','Perfis e permissões por operação.',`<button class="btn" onclick="addUser()">+ Usuário</button>`)+table(['USUÁRIO','PERFIL','ESCOPO','STATUS'],db.users.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.profile}</td><td>${u.scope}</td><td>${status(u.status)}</td></tr>`))}
function auditPage(){return head('Auditoria','Rastreabilidade das ações na demonstração.',`<button class="btn secondary" onclick="resetDemo()">Restaurar dados demo</button>`)+`<div class="panel">${db.audit.map(a=>`<div class="audit"><b>${a.action}</b> · ${a.module}<span class="muted" style="float:right">${a.time}</span></div>`).join('')}</div>`}
function totem(){return head('Totem de ponto','Simulação do terminal de registro facial.')+`<div class="totem"><span class="kicker">REGISTRO FACIAL DEMONSTRATIVO</span><div class="face">◎</div><h2>Aproxime-se da câmera</h2><p class="muted">Nenhuma câmera ou biometria real é utilizada nesta demo.</p><br><button class="btn" onclick="simulateFace()">Simular reconhecimento</button></div>`}
const pages={overview,operation,history,employees,point,lists,dailies,closings,payments,documents,epis,reports,calendar,users,audit:auditPage,totem};
const names={overview:'Visão geral',operation:'Operação do dia',history:'Histórico operacional',employees:'Funcionários',point:'Controle de ponto',lists:'Listas do dia',dailies:'Diárias',closings:'Fechamentos',payments:'Pagamentos',documents:'Documentos',epis:'EPIs',reports:'Relatórios',calendar:'Calendário',users:'Usuários e acessos',audit:'Auditoria',totem:'Totem de ponto'};
let current='overview';
function render(){document.getElementById('content').innerHTML=pages[current]();document.getElementById('crumb').textContent=names[current];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===current))}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{current=b.dataset.page;render();window.scrollTo(0,0)});
function modal(title,body,onSave){let w=document.getElementById('modal'),b=document.getElementById('modalBox');b.innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions"><button class="btn secondary" id="cancel">Cancelar</button><button class="btn" id="saveModal">Salvar</button></div>`;w.classList.add('show');document.getElementById('cancel').onclick=()=>w.classList.remove('show');document.getElementById('saveModal').onclick=()=>{onSave();w.classList.remove('show');save();render()}}
function newEmployee(){modal('Novo funcionário',`<div class="formgrid"><label>Nome<input id="mName" value="Novo Funcionário Demo"></label><label>CPF<input id="mCpf" value="***.000.***-00"></label><label>Função<input id="mRole" value="Auxiliar Logístico"></label><label>Diária<input id="mDaily" type="number" value="100"></label></div>`,()=>{db.employees.push({id:Date.now(),name:mName.value,cpf:mCpf.value,role:mRole.value,status:'Ativo',facial:'Pendente',daily:+mDaily.value});audit('Funcionário cadastrado','Funcionários')})}
function editEmployee(id){let e=emp(id);modal('Editar funcionário',`<div class="formgrid"><label>Nome<input id="mName" value="${e.name}"></label><label>Função<input id="mRole" value="${e.role}"></label><label>Status<select id="mStatus"><option>Ativo</option><option>Inativo</option></select></label><label>Facial<select id="mFacial"><option>Cadastrado</option><option>Pendente</option></select></label></div>`,()=>{e.name=mName.value;e.role=mRole.value;e.status=mStatus.value;e.facial=mFacial.value;audit('Funcionário atualizado','Funcionários')})}
function removeEmployee(id){if(confirm('Excluir este funcionário fictício?')){db.employees=db.employees.filter(e=>e.id!==id);audit('Funcionário excluído','Funcionários');save();render()}}
function newPoint(){let opts=db.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');modal('Registrar ponto',`<div class="formgrid"><label>Funcionário<select id="mEmp">${opts}</select></label><label>Tipo<select id="mType"><option>Entrada</option><option>Saída</option></select></label><label>Horário<input id="mTime" value="${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}"></label><label>Método<select id="mMethod"><option>Facial</option><option>Manual</option></select></label></div>`,()=>{db.points.push({id:Date.now(),emp:+mEmp.value,date:'05/10/2026',time:mTime.value,type:mType.value,method:mMethod.value});audit('Ponto registrado','Controle de ponto')})}
function newDaily(){let opts=db.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');modal('Nova diária',`<div class="formgrid"><label>Funcionário<select id="mEmp">${opts}</select></label><label>Data<input id="mDate" value="05/10/2026"></label><label>Base<input id="mBase" type="number" value="100"></label><label>VT<input id="mVt" type="number" value="12"></label><label>VR<input id="mVr" type="number" value="32"></label></div>`,()=>{db.dailies.push({id:Date.now(),emp:+mEmp.value,date:mDate.value,base:+mBase.value,vt:+mVt.value,vr:+mVr.value,status:'Em conferência'});audit('Diária lançada','Diárias')})}
function approveDaily(id){db.dailies.find(x=>x.id===id).status='Aprovada';audit('Diária aprovada','Diárias');save();render();toast('Diária aprovada')}
function pay(id){db.payments.find(x=>x.id===id).status='Pago';audit('Pagamento confirmado','Pagamentos');save();render();toast('Pagamento fictício confirmado')}
function createList(){audit('Lista do dia criada','Operação');save();toast('Lista demonstrativa criada')}
function closePeriod(){audit('Fechamento do período simulado','Fechamentos');save();toast('Fechamento demonstrativo concluído')}
function addDocument(){db.docs.push({id:Date.now(),name:'Documento demonstrativo '+(db.docs.length+1),type:'Documento',status:'Disponível'});audit('Documento adicionado','Documentos');save();render()}
function addEpi(){db.epis.push({id:Date.now(),emp:db.employees[0].id,item:'EPI demonstrativo',qty:1,date:'05/10/2026'});audit('Entrega de EPI registrada','EPIs');save();render()}
function addUser(){db.users.push({id:Date.now(),name:'Usuário Demo '+(db.users.length+1),profile:'Supervisor',scope:'Nexus Logística',status:'Ativo'});audit('Usuário criado','Usuários');save();render()}
function simulateFace(){db.points.push({id:Date.now(),emp:db.employees[0].id,date:'05/10/2026',time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),type:'Entrada',method:'Facial'});audit('Reconhecimento facial simulado','Totem');save();toast('Lucas Almeida reconhecido — entrada registrada')}
function resetDemo(){if(confirm('Restaurar todos os dados fictícios?')){db=structuredClone(seed);save();render();toast('Demo restaurada')}}
function exportDemo(){let csv='Nome,CPF,Funcao,Status\n'+db.employees.map(e=>`${e.name},${e.cpf},${e.role},${e.status}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='funcionarios-demo.csv';a.click();audit('Relatório CSV exportado','Relatórios');save()}
render();
</script>
</body></html>
