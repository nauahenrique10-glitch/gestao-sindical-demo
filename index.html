<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Sindical — Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:#171126;background:#f7f6fa;font-size:13px}.app{min-height:100vh;display:flex}aside{width:210px;background:#21182b;color:#ddd5e5;padding:18px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.logo{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo>span{width:34px;height:34px;border-radius:9px;background:#fff;color:#5b2c72;display:grid;place-items:center;font-weight:900}.logo div{display:flex;flex-direction:column}.logo small{font-size:8px;letter-spacing:2px;color:#9f91aa}.demoTag{font-size:9px;line-height:1.5;border:1px solid #4c3b58;background:#2c2038;padding:10px;border-radius:10px;margin-bottom:18px}.demoTag b{color:#d7b8ea}.group{display:block;font-size:8px;letter-spacing:1.6px;color:#8e8098;margin:17px 8px 7px}aside button{width:100%;text-align:left;border:0;background:transparent;color:#cfc6d7;padding:10px 12px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:11px}aside button:hover,aside button.active{background:#eee8f6;color:#3f2250;font-weight:800}main{margin-left:210px;width:calc(100% - 210px)}.top{height:58px;background:white;border-bottom:1px solid #e9e4ed;display:flex;align-items:center;justify-content:space-between;padding:0 40px;color:#776a80;font-size:10px}.top>div{display:flex;align-items:center;gap:10px}.top label{font-size:8px;font-weight:800;letter-spacing:1px}.top select{display:block;margin-top:3px;border:1px solid #ded6e5;border-radius:7px;padding:7px 28px 7px 9px;background:#faf8fc;color:#49275c}.user{margin-left:12px}.body{max-width:1180px;margin:auto;padding:38px 36px}header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}h1{font-size:28px;margin:4px 0 5px}h2{font-size:27px;line-height:1.18;margin:12px 0}h3{font-size:14px;margin:24px 0 12px}p{color:#756a7c;margin:0;line-height:1.6}em{font-style:normal;color:#72438c;font-weight:900;font-size:9px;letter-spacing:1.5px}button{font-family:inherit}.body button{border:0;border-radius:7px;background:#4a285c;color:white;padding:10px 14px;font-weight:750;cursor:pointer}.hero{background:#33243e;color:white;border-radius:14px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.hero p{color:#d8ccdf;max-width:490px}.hero button{background:#f4edf8;color:#4a285c;margin-top:20px}.heroStat{min-width:180px;border-left:1px solid #675873;padding-left:30px;display:flex;flex-direction:column}.heroStat strong{font-size:42px}.heroStat small{color:#d8ccdf}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card,.panel,.chart,.flow>div,.search{background:white;border:1px solid #e6e0e9;border-radius:11px;padding:18px}.card{display:flex;flex-direction:column;min-height:105px}.card span{font-size:10px;color:#7d7184}.card strong{font-size:23px;margin:9px 0 4px}.card small{color:#9b909f}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.flow>div{display:flex;flex-direction:column;position:relative}.flow small{align-self:flex-end;color:#b69cc5}.flow strong{margin:8px 0}.flow span{font-size:9px;color:#95899a}.panel{padding:0;overflow:hidden;margin-top:14px}.panel h3,.panel.list{padding:18px}.panel.list p{margin-bottom:14px}.search{margin-bottom:14px;color:#9a8fa0}.search span{float:right;color:#665b6b}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f8f5fa;color:#7b6885;font-size:8px;letter-spacing:.7px;padding:12px}td{padding:14px 12px;border-top:1px solid #eee9f0;color:#675b6d;font-size:10px}td b{color:#34223e}td small{display:block;margin-top:4px;color:#9b909f}.ok,.wait{padding:4px 7px;border-radius:7px;font-size:8px;font-weight:800}.ok{background:#e9f7ef;color:#35845a}.wait{background:#fff3df;color:#9a6920}.ghost{background:#faf7fc!important;color:#6a3b80!important;border:1px solid #e1d6e7!important;padding:7px 10px!important;font-size:9px}.chart{margin-top:14px}.bar{display:grid;grid-template-columns:80px 1fr 30px;gap:10px;align-items:center;margin:16px 0;font-size:10px}.bar i{height:13px;border-radius:10px;background:linear-gradient(90deg,#5c3370,#a475bc)}.toast{position:fixed;right:24px;bottom:24px;background:#24192d;color:white;padding:12px 18px;border-radius:9px;box-shadow:0 8px 30px #0003}@media(max-width:850px){aside{width:170px}main{margin-left:170px;width:calc(100% - 170px)}.top{padding:0 15px}.top label{display:none}.body{padding:25px 18px}.flow{grid-template-columns:1fr 1fr}.heroStat{display:none}}
</style></head><body><div class="app"><aside><div class="logo"><span>GS</span><div><b>Gestão Sindical</b><small>DEMONSTRAÇÃO</small></div></div><div class="demoTag">AMBIENTE DEMONSTRATIVO<br><b>Dados 100% fictícios</b></div><small class="group">OPERAÇÃO</small><button class="active" data-page="overview">Visão geral</button><button data-page="operation">Operação do dia</button><button data-page="workers">Funcionários</button><button data-page="dailies">Diárias</button><small class="group">FINANCEIRO</small><button data-page="closings">Fechamentos</button><button data-page="payments">Pagamentos</button><small class="group">GESTÃO</small><button data-page="reports">Relatórios</button><button data-page="users">Usuários e acessos</button></aside><main><div class="top"><span>Meu espaço　/　<b id="crumb">Visão geral</b></span><div><label>EMPRESA <select><option>Nexus Logística</option><option>Atlas Distribuição</option></select></label><label>TURNO <select><option>PM</option><option>AM</option></select></label><span class="user">AD　<b>Administrador Demo</b></span></div></div><div class="body" id="body"></div></main><div class="toast" id="toast" style="display:none"></div></div><script>
const workers=[['Lucas Almeida','***.482.***-10','Auxiliar Logístico','Cadastrado'],['Mariana Costa','***.731.***-42','Auxiliar Logístico','Cadastrado'],['Rafael Martins','***.206.***-55','Conferente','Pendente'],['Beatriz Souza','***.915.***-03','Auxiliar Logístico','Cadastrado'],['Gabriel Rocha','***.347.***-88','Auxiliar Logístico','Pendente'],['Camila Ribeiro','***.604.***-27','Líder de Equipe','Cadastrado']];
const names={overview:'Visão geral',operation:'Operação do dia',workers:'Funcionários',dailies:'Diárias',closings:'Fechamentos',payments:'Pagamentos',reports:'Relatórios',users:'Usuários e acessos'};
const cards=a=>`<div class="cards">${a.map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`;
const head=(t,p,b='')=>`<header><div><h1>${t}</h1><p>${p}</p></div>${b}</header>`;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function render(p){document.getElementById('crumb').textContent=names[p];let h='';
if(p==='overview')h=`<header><div><em>GESTÃO DE OPERAÇÕES</em><h1>Sua operação, sob controle.</h1><p>Equipes, diárias e fechamentos em um só lugar.</p></div><b>05/10/2026</b></header><section class="hero"><div><em>PLANEJAR · CONFERIR · GERENCIAR</em><h2>Da escala ao pagamento.<br>Clareza em cada etapa.</h2><p>Acompanhe a equipe e organize as rotinas da operação com informações do período.</p><button onclick="go('operation')">Ver operação do dia</button></div><div class="heroStat"><span>◌</span><strong>12</strong><small>diaristas escalados hoje</small></div></section>${cards([['Diaristas ativos','18','Equipe cadastrada'],['Escalados hoje','12','Lista do dia'],['Diárias pendentes','3','R$ 426,00'],['Pagamentos pendentes','5','R$ 1.284,50']])}<h3>Rotina de gestão</h3><div class="flow">${['Equipe','Escalas','Diárias','Fechamento','Pagamentos'].map((x,i)=>`<div><small>0${i+1}</small><strong>${x}</strong><span>${['Cadastro dos diaristas','Planejamento da operação','Conferência dos dias','Consolidação do período','Acompanhamento dos repasses'][i]}</span></div>`).join('')}</div>`;
if(p==='operation')h=head('Painel Operacional do Dia','Escala, presença, faltas e diárias em uma única visão.','<button onclick="toast('Lista demonstrativa criada')">Criar Lista do Dia</button>')+cards([['Escalados','12','Lista do dia'],['Presentes','10','2 aguardando entrada'],['Faltas lançadas','1','Registro operacional'],['Diárias geradas','10','R$ 1.420,00'],['Valor previsto','R$ 1.704,00','Operação do dia']])+`<div class="panel"><h3 style="padding:18px">Acompanhamento da equipe</h3><table><tbody>${workers.slice(0,5).map((w,i)=>`<tr><td><b>${w[0]}</b><small>${w[2]}</small></td><td>${i<4?'Presente':'Aguardando'}</td><td>${i<4?'Entrada 09:'+(28+i):'—'}</td><td><span class="${i<4?'ok':'wait'}">${i<4?'Ponto registrado':'Pendente'}</span></td></tr>`).join('')}</tbody></table></div>`;
if(p==='workers')h=head('Funcionários','Cadastro completo dos trabalhadores.','<button onclick="toast('Ação desativada na demonstração')">+ Novo Funcionário</button>')+`<div class="search">Pesquisar por nome, CPF ou função... <span>18 funcionário(s) encontrado(s)</span></div><div class="panel"><table><thead><tr><th>NOME</th><th>CPF</th><th>FUNÇÃO</th><th>FACIAL</th><th>STATUS</th><th>AÇÕES</th></tr></thead><tbody>${workers.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td><td><span class="ok">Ativo</span></td><td><button class="ghost" onclick="toast('Cadastro demonstrativo')">Ver cadastro</button></td></tr>`).join('')}</tbody></table></div>`;
if(p==='dailies')h=head('Diárias','Conferência e aprovação dos dias trabalhados.')+cards([['Em conferência','3','R$ 426,00'],['Aprovadas','22','R$ 3.124,00'],['Período','01–15 Out','Fechamento atual']])+`<div class="panel"><table><thead><tr><th>FUNCIONÁRIO</th><th>DATA</th><th>BASE</th><th>VT</th><th>VR</th><th>TOTAL</th><th>STATUS</th></tr></thead><tbody>${workers.slice(0,5).map((w,i)=>`<tr><td><b>${w[0]}</b></td><td>0${4+i}/10/2026</td><td>R$ 100,00</td><td>R$ 12,00</td><td>R$ 32,00</td><td><b>R$ 144,00</b></td><td><span class="${i<2?'wait':'ok'}">${i<2?'Em conferência':'Aprovada'}</span></td></tr>`).join('')}</tbody></table></div>`;
if(p==='closings')h=head('Fechamentos','Consolidação e aprovação por período.','<button onclick="toast('Fechamento demonstrativo')">Novo fechamento</button>')+cards([['Período atual','01–15 Out','Em andamento'],['Diárias aprovadas','22','R$ 3.124,00'],['Pendências','3','Revisão necessária']])+`<div class="panel list"><h3>Fechamento • 01 a 15 de outubro</h3><p>22 diárias aprovadas · 3 em conferência · Valor previsto <b>R$ 3.550,00</b></p><button onclick="toast('Resumo demonstrativo aberto')">Ver resumo</button></div>`;
if(p==='payments')h=head('Pagamentos','Acompanhamento dos repasses aprovados.')+cards([['Aguardando','5','R$ 1.284,50'],['Pagos no período','17','R$ 2.415,50'],['Total do período','22','R$ 3.700,00']])+`<div class="panel"><table><thead><tr><th>BENEFICIÁRIO</th><th>REFERÊNCIA</th><th>VALOR</th><th>MÉTODO</th><th>STATUS</th></tr></thead><tbody>${workers.slice(0,5).map((w,i)=>`<tr><td><b>${w[0]}</b></td><td>1ª quinzena/out</td><td>R$ ${i%2?'288,00':'432,00'}</td><td>PIX</td><td><span class="${i<2?'wait':'ok'}">${i<2?'Aguardando':'Pago'}</span></td></tr>`).join('')}</tbody></table></div>`;
if(p==='reports')h=head('Relatórios','Indicadores consolidados da operação.')+cards([['Presença média','94%','Últimos 30 dias'],['Diárias geradas','47','No mês'],['Valor consolidado','R$ 6.674,00','No mês']])+`<div class="chart"><h3>Diárias por semana</h3>${[72,88,64,95].map((x,i)=>`<div class="bar"><span>Semana ${i+1}</span><i style="width:${x}%"></i><b>${[11,14,9,13][i]}</b></div>`).join('')}</div>`;
if(p==='users')h=head('Usuários e acessos','Perfis e permissões do ambiente demonstrativo.')+`<div class="panel"><table><thead><tr><th>USUÁRIO</th><th>PERFIL</th><th>EMPRESA</th><th>ACESSO</th><th>STATUS</th></tr></thead><tbody>${[['Administrador Demo','Administrador Geral','Todas','Completo'],['Fernanda Lima','Financeiro','Nexus Logística','Financeiro'],['Carlos Mendes','Supervisor','Nexus Logística','Operação']].map(u=>`<tr><td><b>${u[0]}</b></td><td>${u[1]}</td><td>${u[2]}</td><td>${u[3]}</td><td><span class="ok">Ativo</span></td></tr>`).join('')}</tbody></table></div>`;
document.getElementById('body').innerHTML=h}
function go(p){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>go(b.dataset.page));render('overview');
</script></body></html>
